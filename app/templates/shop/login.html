{% extends "shop/base.html" %}{% block title %}Customer sign in · FaultLine{% endblock %}
{% block content %}<section class="panel narrow"><h1>Customer sign in</h1><p>Use a seeded demo customer account. Admin accounts use the admin panel.</p>{% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}<form method="post" action="/shop/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email <input type="email" name="email" required autocomplete="username"></label><label>Password <input type="password" name="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>{% endblock %}
